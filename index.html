<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTV</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }

  .search-wrap {
    width: 560px;
    max-width: 94vw;
    text-align: center;
  }

  .hero-logo {
    font-family: 'Bebas Neue', Arial, sans-serif;
    font-size: 72px;
    letter-spacing: 4px;
    color: #fff;
    margin-bottom: 8px;
    line-height: 1;
  }
  .hero-logo span { color: var(--red); }

  .hero-sub {
    font-size: 14px;
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 40px;
  }

  .type-row { margin-bottom: 20px; display: flex; gap: 10px; justify-content: center; }

  .type-btn {
    flex: 1;
    padding: 12px 0;
    background: var(--bg3);
    color: var(--muted);
    border: 2px solid var(--border);
    border-radius: 7px;
    font-size: 15px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s;
    letter-spacing: 0.5px;
  }
  .type-btn.active { background: var(--red); border-color: var(--red); color: #fff; }
  .type-btn:hover:not(.active) { color: var(--text); border-color: var(--faint); }
  .type-btn:focus { outline: 2px solid var(--red); }

  #search-input {
    width: 100%;
    padding: 16px 20px;
    font-size: 18px;
    background: var(--bg3);
    border: 2px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    font-family: inherit;
    margin-bottom: 16px;
    transition: border-color 0.2s;
  }
  #search-input:focus { border-color: var(--red); outline: none; }

  #go-btn {
    width: 100%;
    padding: 15px;
    font-size: 18px;
    font-family: 'Bebas Neue', Arial, sans-serif;
    letter-spacing: 3px;
  }

  .tip { margin-top: 18px; color: var(--faint); font-size: 13px; letter-spacing: 1px; }

  /* subtle scanline texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(255,255,255,0.015) 2px,
      rgba(255,255,255,0.015) 4px
    );
    pointer-events: none;
    z-index: 0;
  }
  .search-wrap { position: relative; z-index: 1; }
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><p>Loading…</p></div>
<div id="toast"></div>

<div class="search-wrap">
  <div class="hero-logo">You<span>TV</span></div>
  <div class="hero-sub">Search &bull; Watch &bull; Explore</div>

  <div class="type-row">
    <button class="type-btn active" id="type-video"    onclick="setType('video')">Videos</button>
    <button class="type-btn"        id="type-channel"  onclick="setType('channel')">Channels</button>
    <button class="type-btn"        id="type-playlist" onclick="setType('playlist')">Playlists</button>
  </div>

  <input id="search-input" type="text" placeholder="Search YouTube…" autocomplete="off">
  <button id="go-btn" class="btn btn-red" onclick="startSearch()">SEARCH</button>
  <p class="tip">Press ENTER to search</p>
</div>

<script src="shared.js"></script>
<script>
  var currentType = loadState('type', 'video');
  setType(currentType);

  // Restore last query
  var lastQ = loadState('query', '');
  if (lastQ) gid('search-input').value = lastQ;

  function setType(t) {
    currentType = t;
    ['video','channel','playlist'].forEach(function(k) {
      var el = gid('type-' + k);
      if (el) el.className = 'type-btn' + (k === t ? ' active' : '');
    });
  }

  function startSearch() {
    var q = gid('search-input').value.trim();
    if (!q) return;
    saveState('query', q);
    saveState('type', currentType);
    window.location.href = 'search.html';
  }

  gid('search-input').addEventListener('keydown', function(e) {
    if (e.keyCode === 13) startSearch();
  });
</script>
</body>
</html>
