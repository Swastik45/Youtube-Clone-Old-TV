<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube TV</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --red: #FF2D2D;
    --red-dim: #b31f1f;
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1e1e1e;
    --surface3: #2a2a2a;
    --border: #2e2e2e;
    --text: #f0f0f0;
    --muted: #888;
    --focus: #FF2D2D;
    --focus-glow: 0 0 0 3px rgba(255,45,45,0.4);
    --radius: 10px;
    --font: 'DM Sans', sans-serif;
    --mono: 'DM Mono', monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 16px;
    overflow: hidden;
  }

  /* ── SCREENS ── */
  .screen { display: none; width: 100vw; height: 100vh; }
  .screen.active { display: flex; flex-direction: column; }

  /* ── SEARCH SCREEN ── */
  #search-screen {
    align-items: center;
    justify-content: center;
    background: var(--bg);
  }

  .logo {
    font-size: 3rem;
    font-weight: 700;
    letter-spacing: -2px;
    margin-bottom: 2.5rem;
    color: var(--text);
  }
  .logo span { color: var(--red); }

  .search-wrap {
    width: min(620px, 90vw);
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .search-row {
    display: flex;
    gap: 0.5rem;
  }

  #search-input {
    flex: 1;
    padding: 1rem 1.25rem;
    font-size: 1.1rem;
    font-family: var(--font);
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #search-input:focus {
    border-color: var(--red);
    box-shadow: var(--focus-glow);
  }
  #search-input::placeholder { color: var(--muted); }

  .btn {
    padding: 1rem 1.5rem;
    font-size: 1rem;
    font-family: var(--font);
    font-weight: 500;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, box-shadow 0.15s, transform 0.1s;
    white-space: nowrap;
  }
  .btn:hover, .btn:focus {
    background: var(--surface3);
    border-color: var(--red);
    box-shadow: var(--focus-glow);
    outline: none;
  }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
  .btn.primary:hover, .btn.primary:focus { background: var(--red-dim); border-color: var(--red-dim); }

  .type-tabs {
    display: flex;
    gap: 0.5rem;
  }
  .type-tab {
    flex: 1;
    padding: 0.65rem;
    text-align: center;
    font-size: 0.9rem;
    font-weight: 500;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }
  .type-tab:hover, .type-tab:focus { border-color: var(--red); color: var(--text); outline: none; box-shadow: var(--focus-glow); }
  .type-tab.active { background: var(--red); border-color: var(--red); color: #fff; }

  .tip {
    font-size: 0.8rem;
    color: var(--muted);
    text-align: center;
    margin-top: 0.5rem;
  }
  .tip kbd {
    font-family: var(--mono);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 0.75rem;
  }

  /* ── RESULTS SCREEN ── */
  #results-screen { background: var(--bg); }

  .results-header {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .results-header .logo-small {
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: -1px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .results-header .logo-small span { color: var(--red); }

  .results-search-row {
    display: flex;
    gap: 0.5rem;
    flex: 1;
  }
  #results-search-input {
    flex: 1;
    padding: 0.65rem 1rem;
    font-size: 0.95rem;
    font-family: var(--font);
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #results-search-input:focus { border-color: var(--red); box-shadow: var(--focus-glow); }

  .results-type-tabs {
    display: flex;
    gap: 0.4rem;
    flex-shrink: 0;
  }
  .results-type-tab {
    padding: 0.45rem 0.9rem;
    font-size: 0.8rem;
    font-weight: 500;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }
  .results-type-tab:hover, .results-type-tab:focus { border-color: var(--red); color: var(--text); outline: none; }
  .results-type-tab.active { background: var(--red); border-color: var(--red); color: #fff; }

  .results-body {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    scroll-behavior: smooth;
  }
  .results-body::-webkit-scrollbar { width: 5px; }
  .results-body::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 10px; }

  .results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1rem;
  }

  .card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
    outline: none;
    position: relative;
  }
  .card:hover, .card:focus, .card.focused {
    border-color: var(--red);
    box-shadow: var(--focus-glow);
    transform: translateY(-2px);
  }
  .card img {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    display: block;
    background: var(--surface2);
  }
  .card-body { padding: 0.75rem; }
  .card-title {
    font-size: 0.9rem;
    font-weight: 500;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 0.4rem;
  }
  .card-meta { font-size: 0.75rem; color: var(--muted); }
  .card-badge {
    display: inline-block;
    background: var(--red);
    color: #fff;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 2px 7px;
    border-radius: 4px;
    margin-top: 5px;
    text-transform: uppercase;
  }
  .card-play-icon {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -70%) scale(0);
    width: 48px; height: 48px;
    background: rgba(255,45,45,0.9);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s, opacity 0.15s;
    pointer-events: none;
  }
  .card-play-icon::after {
    content: '';
    border-left: 18px solid #fff;
    border-top: 11px solid transparent;
    border-bottom: 11px solid transparent;
    margin-left: 4px;
  }
  .card:hover .card-play-icon,
  .card:focus .card-play-icon,
  .card.focused .card-play-icon { transform: translate(-50%, -70%) scale(1); }

  /* ── PLAYER SCREEN ── */
  #player-screen { background: #000; position: relative; }

  #yt-player-wrap {
    position: relative;
    width: 100%;
    flex: 1;
    background: #000;
  }
  #yt-player { width: 100%; height: 100%; }

  .player-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 40%);
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 2rem;
  }
  .player-overlay.visible { opacity: 1; pointer-events: all; }

  .player-title {
    font-size: 1.4rem;
    font-weight: 500;
    margin-bottom: 1.2rem;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    max-width: 70%;
  }

  .player-controls {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
  }
  .ctrl-btn {
    padding: 0.6rem 1.2rem;
    font-size: 0.9rem;
    font-family: var(--font);
    font-weight: 500;
    border: 1.5px solid rgba(255,255,255,0.3);
    border-radius: 8px;
    background: rgba(255,255,255,0.1);
    color: #fff;
    cursor: pointer;
    transition: all 0.15s;
    backdrop-filter: blur(4px);
  }
  .ctrl-btn:hover, .ctrl-btn:focus {
    background: var(--red);
    border-color: var(--red);
    outline: none;
    box-shadow: var(--focus-glow);
  }
  .ctrl-btn.big {
    padding: 0.7rem 1.6rem;
    font-size: 1rem;
    background: var(--red);
    border-color: var(--red);
  }

  .progress-bar-wrap {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
    margin-bottom: 1rem;
    cursor: pointer;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--red);
    border-radius: 2px;
    width: 0%;
    transition: width 0.5s linear;
  }

  .player-time {
    font-family: var(--mono);
    font-size: 0.85rem;
    color: rgba(255,255,255,0.7);
  }

  /* ── CHANNEL SCREEN ── */
  #channel-screen { background: var(--bg); }
  .channel-header-wrap {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .channel-banner-img {
    width: 100%;
    height: 120px;
    object-fit: cover;
    display: block;
  }
  .channel-info-row {
    display: flex;
    align-items: center;
    gap: 1.25rem;
    padding: 1rem 1.5rem;
  }
  .channel-avatar {
    width: 72px; height: 72px;
    border-radius: 50%;
    border: 3px solid var(--red);
    flex-shrink: 0;
  }
  .channel-name { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.25rem; }
  .channel-stats { font-size: 0.8rem; color: var(--muted); }
  .channel-stats span { color: var(--text); font-weight: 500; margin-right: 1.2rem; }

  .channel-body {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    scroll-behavior: smooth;
  }
  .channel-body::-webkit-scrollbar { width: 5px; }
  .channel-body::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 10px; }

  .section-heading {
    font-size: 1rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 1rem;
  }
  .section-heading span { color: var(--red); margin-right: 0.5rem; }

  /* ── PLAYLIST SCREEN ── */
  #playlist-screen { background: var(--bg); }
  .playlist-header-info {
    padding: 1.25rem 1.5rem;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    display: flex;
    gap: 1rem;
    align-items: center;
  }
  .playlist-thumb {
    width: 120px;
    aspect-ratio: 16/9;
    object-fit: cover;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .playlist-meta-text h2 { font-size: 1.15rem; margin-bottom: 0.35rem; }
  .playlist-meta-text p { font-size: 0.8rem; color: var(--muted); }

  .playlist-body {
    flex: 1;
    overflow-y: auto;
    padding: 1rem 1.5rem;
    scroll-behavior: smooth;
  }
  .playlist-body::-webkit-scrollbar { width: 5px; }
  .playlist-body::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 10px; }

  .playlist-item {
    display: flex;
    gap: 0.85rem;
    align-items: center;
    padding: 0.65rem 0.85rem;
    border-radius: 8px;
    border: 1.5px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
    margin-bottom: 0.5rem;
  }
  .playlist-item:hover, .playlist-item:focus, .playlist-item.focused {
    background: var(--surface);
    border-color: var(--red);
    box-shadow: var(--focus-glow);
    outline: none;
  }
  .playlist-num {
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--muted);
    width: 22px;
    flex-shrink: 0;
    text-align: right;
  }
  .playlist-item-thumb {
    width: 120px;
    aspect-ratio: 16/9;
    object-fit: cover;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .playlist-item-title { font-size: 0.9rem; font-weight: 500; }
  .playlist-item-ch { font-size: 0.75rem; color: var(--muted); margin-top: 3px; }

  /* ── LOADING / TOAST ── */
  #loading {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  #loading.visible { opacity: 1; pointer-events: all; }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--surface3);
    border-top-color: var(--red);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #toast {
    position: fixed;
    bottom: 2rem; left: 50%;
    transform: translateX(-50%) translateY(2rem);
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.7rem 1.4rem;
    border-radius: 8px;
    font-size: 0.9rem;
    opacity: 0;
    transition: all 0.25s;
    z-index: 9999;
    pointer-events: none;
    white-space: nowrap;
  }
  #toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── NAV BAR ── */
  .nav-bar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.75rem 1.5rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  /* ── EMPTY / ERROR ── */
  .empty-state {
    text-align: center;
    padding: 4rem;
    color: var(--muted);
    font-size: 1rem;
  }
  .empty-state big { display: block; font-size: 3rem; margin-bottom: 1rem; }

  /* ── SCROLLBAR FOCUS FOR TV ── */
  *:focus-visible { outline: none; }
</style>
</head>
<body>

<!-- Loading overlay -->
<div id="loading"><div class="spinner"></div></div>
<div id="toast"></div>

<!-- ════════════ SEARCH SCREEN ════════════ -->
<div id="search-screen" class="screen active">
  <div class="logo">You<span>TV</span></div>
  <div class="search-wrap">
    <div class="type-tabs" id="search-type-tabs">
      <button class="type-tab active" data-type="video" tabindex="0">▶ Videos</button>
      <button class="type-tab" data-type="channel" tabindex="0">📡 Channels</button>
      <button class="type-tab" data-type="playlist" tabindex="0">📚 Playlists</button>
    </div>
    <div class="search-row">
      <input id="search-input" type="text" placeholder="Search YouTube…" autocomplete="off" autofocus>
      <button class="btn primary" id="search-btn">Search</button>
    </div>
    <p class="tip"><kbd>Enter</kbd> to search &nbsp;·&nbsp; <kbd>↑↓←→</kbd> navigate &nbsp;·&nbsp; <kbd>Space/Enter</kbd> select</p>
  </div>
</div>

<!-- ════════════ RESULTS SCREEN ════════════ -->
<div id="results-screen" class="screen">
  <div class="results-header">
    <div class="logo-small" id="results-logo" tabindex="0">You<span>TV</span></div>
    <div class="results-search-row">
      <input id="results-search-input" type="text" autocomplete="off">
      <button class="btn primary" id="results-search-btn">Go</button>
    </div>
    <div class="results-type-tabs" id="results-type-tabs">
      <button class="results-type-tab active" data-type="video" tabindex="0">Videos</button>
      <button class="results-type-tab" data-type="channel" tabindex="0">Channels</button>
      <button class="results-type-tab" data-type="playlist" tabindex="0">Playlists</button>
    </div>
  </div>
  <div class="results-body" id="results-body">
    <div class="results-grid" id="results-grid"></div>
  </div>
</div>

<!-- ════════════ PLAYER SCREEN ════════════ -->
<div id="player-screen" class="screen">
  <div id="yt-player-wrap">
    <div id="yt-player"></div>
    <div class="player-overlay" id="player-overlay">
      <div class="player-title" id="player-title"></div>
      <div class="progress-bar-wrap" id="progress-bar-wrap">
        <div class="progress-bar-fill" id="progress-bar-fill"></div>
      </div>
      <div class="player-controls">
        <span class="player-time" id="player-time">0:00 / 0:00</span>
        <button class="ctrl-btn big" id="play-pause-btn" tabindex="0">⏸ Pause</button>
        <button class="ctrl-btn" id="seek-back-btn" tabindex="0">⏪ -10s</button>
        <button class="ctrl-btn" id="seek-fwd-btn" tabindex="0">+10s ⏩</button>
        <button class="ctrl-btn" id="mute-btn" tabindex="0">🔇 Mute</button>
        <button class="ctrl-btn" id="vol-up-btn" tabindex="0">🔊 Vol +</button>
        <button class="ctrl-btn" id="vol-down-btn" tabindex="0">🔉 Vol -</button>
        <button class="ctrl-btn" id="fullscreen-btn" tabindex="0">⛶ Fullscreen</button>
        <button class="ctrl-btn" id="back-from-player-btn" tabindex="0">← Back</button>
      </div>
    </div>
  </div>
</div>

<!-- ════════════ CHANNEL SCREEN ════════════ -->
<div id="channel-screen" class="screen">
  <div class="nav-bar">
    <button class="btn" id="back-from-channel-btn" tabindex="0">← Back</button>
    <span id="channel-nav-title" style="font-weight:500; font-size:0.95rem;"></span>
  </div>
  <div class="channel-header-wrap">
    <img class="channel-banner-img" id="channel-banner" src="" alt="" onerror="this.style.display='none'">
    <div class="channel-info-row">
      <img class="channel-avatar" id="channel-avatar" src="" alt="">
      <div>
        <div class="channel-name" id="channel-name"></div>
        <div class="channel-stats" id="channel-stats"></div>
      </div>
    </div>
  </div>
  <div class="channel-body" id="channel-body">
    <div style="margin-bottom:1.5rem;">
      <div class="section-heading"><span>▶</span>Latest Videos</div>
      <div class="results-grid" id="channel-videos-grid"></div>
    </div>
    <div id="channel-playlists-section" style="margin-top:1.5rem; display:none;">
      <div class="section-heading"><span>📚</span>Playlists</div>
      <div class="results-grid" id="channel-playlists-grid"></div>
    </div>
  </div>
</div>

<!-- ════════════ PLAYLIST SCREEN ════════════ -->
<div id="playlist-screen" class="screen">
  <div class="nav-bar">
    <button class="btn" id="back-from-playlist-btn" tabindex="0">← Back</button>
    <button class="btn primary" id="play-all-btn" tabindex="0">▶ Play All</button>
  </div>
  <div class="playlist-header-info" id="playlist-header-info"></div>
  <div class="playlist-body" id="playlist-body"></div>
</div>

<!-- YouTube IFrame API -->
<script src="https://www.youtube.com/iframe_api"></script>
<script>
const API_KEY = 'AIzaSyA3ojztcYc5xHXBk_GpzYdYE2irCLsxmqc';

// ── STATE ──
let currentScreen = 'search';
let searchType = 'video';
let resultsType = 'video';
let currentQuery = '';
let ytPlayer = null;
let playerReady = false;
let overlayTimer = null;
let progressTimer = null;
let volume = 100;
let muted = false;
let currentVideoTitle = '';
let backTarget = 'results'; // where player "back" goes

// ── UTILS ──
function $(id) { return document.getElementById(id); }
function showLoading() { $('loading').classList.add('visible'); }
function hideLoading() { $('loading').classList.remove('visible'); }

function toast(msg, duration=2500) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('visible');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('visible'), duration);
}

function fmt(n) {
  if (!n) return '0';
  n = parseInt(n);
  if (n >= 1e9) return (n/1e9).toFixed(1)+'B';
  if (n >= 1e6) return (n/1e6).toFixed(1)+'M';
  if (n >= 1e3) return (n/1e3).toFixed(1)+'K';
  return n.toString();
}
function fmtTime(s) {
  s = Math.floor(s||0);
  const m = Math.floor(s/60), sec = s%60;
  return m+':'+(sec<10?'0':'')+sec;
}

async function api(endpoint, params) {
  const url = `https://www.googleapis.com/youtube/v3/${endpoint}?${new URLSearchParams({key:API_KEY,...params})}`;
  const res = await fetch(url);
  return res.json();
}

// ── SCREENS ──
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(`${name}-screen`).classList.add('active');
  currentScreen = name;
}

// ── YOUTUBE PLAYER ──
function onYouTubeIframeAPIReady() {
  ytPlayer = new YT.Player('yt-player', {
    height: '100%',
    width: '100%',
    playerVars: {
      autoplay: 1,
      controls: 0,       // hide YouTube controls — we have our own
      rel: 0,
      modestbranding: 1,
      iv_load_policy: 3,
      fs: 0,
      playsinline: 1,
    },
    events: {
      onReady: () => { playerReady = true; },
      onStateChange: onPlayerStateChange,
      onError: onPlayerError,
    }
  });
}

function onPlayerStateChange(e) {
  const states = {'-1':'unstarted','0':'ended','1':'playing','2':'paused','3':'buffering','5':'cued'};
  if (e.data === YT.PlayerState.PLAYING) {
    $('play-pause-btn').textContent = '⏸ Pause';
    startProgressTimer();
  } else if (e.data === YT.PlayerState.PAUSED) {
    $('play-pause-btn').textContent = '▶ Play';
    stopProgressTimer();
  } else if (e.data === YT.PlayerState.ENDED) {
    stopProgressTimer();
    showOverlay();
  }
}

function onPlayerError(e) {
  const codes = {2:'Invalid video ID',5:'HTML5 error',100:'Video not found',101:'Embed not allowed',150:'Embed not allowed'};
  toast('⚠ ' + (codes[e.data] || 'Playback error') + '. Try another video.');
  stopProgressTimer();
}

function playVideo(videoId, title) {
  if (!playerReady) { toast('Player not ready yet, please wait…'); return; }
  currentVideoTitle = title || '';
  $('player-title').textContent = title || '';
  showScreen('player');
  ytPlayer.loadVideoById(videoId);
  showOverlay();
}

function startProgressTimer() {
  stopProgressTimer();
  progressTimer = setInterval(() => {
    if (!ytPlayer || !playerReady) return;
    try {
      const cur = ytPlayer.getCurrentTime();
      const dur = ytPlayer.getDuration();
      if (dur > 0) {
        $('progress-bar-fill').style.width = ((cur/dur)*100) + '%';
        $('player-time').textContent = fmtTime(cur) + ' / ' + fmtTime(dur);
      }
    } catch(e) {}
  }, 500);
}
function stopProgressTimer() { clearInterval(progressTimer); }

function showOverlay() {
  $('player-overlay').classList.add('visible');
  clearTimeout(overlayTimer);
  overlayTimer = setTimeout(hideOverlay, 4000);
}
function hideOverlay() { $('player-overlay').classList.remove('visible'); }

// Player screen mouse move → show overlay
$('player-screen').addEventListener('mousemove', showOverlay);
$('player-screen').addEventListener('click', showOverlay);

// Player controls
$('play-pause-btn').addEventListener('click', () => {
  if (!playerReady) return;
  const state = ytPlayer.getPlayerState();
  if (state === YT.PlayerState.PLAYING) ytPlayer.pauseVideo();
  else ytPlayer.playVideo();
  showOverlay();
});
$('seek-back-btn').addEventListener('click', () => {
  if (!playerReady) return;
  ytPlayer.seekTo(Math.max(0, ytPlayer.getCurrentTime()-10), true); showOverlay();
});
$('seek-fwd-btn').addEventListener('click', () => {
  if (!playerReady) return;
  ytPlayer.seekTo(ytPlayer.getCurrentTime()+10, true); showOverlay();
});
$('mute-btn').addEventListener('click', () => {
  if (!playerReady) return;
  muted = !muted;
  muted ? ytPlayer.mute() : ytPlayer.unMute();
  $('mute-btn').textContent = muted ? '🔊 Unmute' : '🔇 Mute';
  showOverlay();
});
$('vol-up-btn').addEventListener('click', () => {
  if (!playerReady) return;
  volume = Math.min(100, volume+10);
  ytPlayer.setVolume(volume); showOverlay();
});
$('vol-down-btn').addEventListener('click', () => {
  if (!playerReady) return;
  volume = Math.max(0, volume-10);
  ytPlayer.setVolume(volume); showOverlay();
});
$('fullscreen-btn').addEventListener('click', () => {
  const el = $('player-screen');
  if (!document.fullscreenElement) el.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
  showOverlay();
});
$('back-from-player-btn').addEventListener('click', () => {
  if (playerReady) ytPlayer.pauseVideo();
  stopProgressTimer();
  showScreen(backTarget);
});

// Progress bar click
$('progress-bar-wrap').addEventListener('click', (e) => {
  if (!playerReady) return;
  const rect = e.target.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  ytPlayer.seekTo(ytPlayer.getDuration() * pct, true);
});

// ── SEARCH ──
function doSearch(query, type) {
  if (!query.trim()) return;
  currentQuery = query;
  resultsType = type || resultsType;
  $('results-search-input').value = query;
  document.querySelectorAll('.results-type-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.type === resultsType);
  });
  showScreen('results');
  loadResults(query, resultsType);
}

async function loadResults(query, type) {
  showLoading();
  $('results-grid').innerHTML = '';
  try {
    const data = await api('search', {
      part: 'snippet', q: query, type: type,
      maxResults: 50, order: 'relevance'
    });
    hideLoading();
    renderResults(data.items || [], type);
  } catch(e) {
    hideLoading();
    $('results-grid').innerHTML = '<div class="empty-state"><big>⚠</big>Failed to load. Check your API key.</div>';
  }
}

function renderResults(items, type) {
  const grid = $('results-grid');
  if (!items.length) {
    grid.innerHTML = '<div class="empty-state"><big>🔍</big>No results found.</div>';
    return;
  }
  grid.innerHTML = '';
  items.forEach((item, i) => {
    const card = makeCard(item, type);
    if (card) { card.dataset.index = i; grid.appendChild(card); }
  });
  // Focus first card
  const first = grid.querySelector('.card');
  if (first) first.focus();
}

function makeCard(item, type) {
  const div = document.createElement('div');
  div.className = 'card';
  div.tabIndex = 0;

  const thumb = item.snippet?.thumbnails?.medium?.url || '';
  const title = item.snippet?.title || 'Untitled';
  const channel = item.snippet?.channelTitle || '';
  const date = item.snippet?.publishedAt ? new Date(item.snippet.publishedAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '';

  if (type === 'video') {
    const vid = item.id?.videoId;
    if (!vid) return null;
    div.innerHTML = `
      <div class="card-play-icon"></div>
      <img src="${thumb}" alt="" loading="lazy">
      <div class="card-body">
        <div class="card-title">${escHtml(title)}</div>
        <div class="card-meta">${escHtml(channel)} · ${date}</div>
      </div>`;
    div.addEventListener('click', () => { backTarget='results'; playVideo(vid, title); });
    div.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' ') { e.preventDefault(); backTarget='results'; playVideo(vid,title); } });
  } else if (type === 'channel') {
    const chId = item.id?.channelId;
    if (!chId) return null;
    const desc = item.snippet?.description?.slice(0,80) || '';
    div.innerHTML = `
      <img src="${thumb}" alt="" loading="lazy" style="aspect-ratio:1;object-fit:cover;">
      <div class="card-body">
        <div class="card-title">${escHtml(title)}</div>
        <div class="card-meta">${escHtml(desc)}</div>
        <span class="card-badge">Channel</span>
      </div>`;
    div.addEventListener('click', () => loadChannel(chId));
    div.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' ') { e.preventDefault(); loadChannel(chId); } });
  } else if (type === 'playlist') {
    const plId = item.id?.playlistId;
    if (!plId) return null;
    div.innerHTML = `
      <img src="${thumb}" alt="" loading="lazy">
      <div class="card-body">
        <div class="card-title">${escHtml(title)}</div>
        <div class="card-meta">${escHtml(channel)}</div>
        <span class="card-badge">Playlist</span>
      </div>`;
    div.addEventListener('click', () => loadPlaylist(plId, title, thumb));
    div.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' ') { e.preventDefault(); loadPlaylist(plId,title,thumb); } });
  }
  return div;
}

// ── CHANNEL ──
async function loadChannel(channelId) {
  showLoading();
  try {
    const [chData, vidData, plData] = await Promise.all([
      api('channels', { part:'snippet,statistics,brandingSettings', id: channelId }),
      api('search', { part:'snippet', channelId, maxResults:50, order:'date', type:'video' }),
      api('playlists', { part:'snippet,contentDetails', channelId, maxResults:20 })
    ]);
    hideLoading();

    const ch = chData.items?.[0];
    if (!ch) { toast('Channel not found'); return; }

    $('channel-nav-title').textContent = ch.snippet.title;
    $('channel-name').textContent = ch.snippet.title;
    const stats = ch.statistics;
    $('channel-stats').innerHTML = `
      <span>${fmt(stats.subscriberCount)} subscribers</span>
      <span>${fmt(stats.videoCount)} videos</span>
      <span>${fmt(stats.viewCount)} views</span>`;
    const avatar = ch.snippet.thumbnails?.high?.url || ch.snippet.thumbnails?.medium?.url || '';
    $('channel-avatar').src = avatar;
    const banner = ch.brandingSettings?.image?.bannerExternalUrl || '';
    const bannerEl = $('channel-banner');
    if (banner) { bannerEl.src = banner; bannerEl.style.display='block'; }
    else bannerEl.style.display='none';

    // Videos
    const vGrid = $('channel-videos-grid');
    vGrid.innerHTML = '';
    (vidData.items||[]).forEach(item => {
      const card = makeCard(item, 'video');
      if (card) {
        // Override back target for channel-launched videos
        card.addEventListener('click', () => { backTarget='channel'; }, true);
        vGrid.appendChild(card);
      }
    });

    // Playlists
    const plSection = $('channel-playlists-section');
    const plGrid = $('channel-playlists-grid');
    plGrid.innerHTML = '';
    const plItems = plData.items||[];
    if (plItems.length) {
      plSection.style.display = 'block';
      plItems.forEach(item => {
        const thumb = item.snippet?.thumbnails?.medium?.url || '';
        const title = item.snippet?.title || '';
        const count = item.contentDetails?.itemCount || 0;
        const card = document.createElement('div');
        card.className = 'card'; card.tabIndex = 0;
        card.innerHTML = `
          <img src="${thumb}" alt="" loading="lazy">
          <div class="card-body">
            <div class="card-title">${escHtml(title)}</div>
            <div class="card-meta">${count} videos</div>
            <span class="card-badge">Playlist</span>
          </div>`;
        card.addEventListener('click', () => loadPlaylist(item.id, title, thumb));
        card.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' ') { e.preventDefault(); loadPlaylist(item.id,title,thumb); } });
        plGrid.appendChild(card);
      });
    } else {
      plSection.style.display = 'none';
    }

    showScreen('channel');
  } catch(e) {
    hideLoading();
    toast('Failed to load channel');
    console.error(e);
  }
}

$('back-from-channel-btn').addEventListener('click', () => showScreen('results'));

// ── PLAYLIST ──
let currentPlaylistId = '';

async function loadPlaylist(playlistId, title, thumb) {
  currentPlaylistId = playlistId;
  showLoading();
  try {
    const [plData, itemsData] = await Promise.all([
      api('playlists', { part:'snippet,contentDetails', id: playlistId }),
      api('playlistItems', { part:'snippet,contentDetails', playlistId, maxResults:50 })
    ]);
    hideLoading();

    const pl = plData.items?.[0];
    const items = itemsData.items || [];
    const plTitle = pl?.snippet?.title || title || 'Playlist';
    const plThumb = pl?.snippet?.thumbnails?.medium?.url || thumb || '';
    const plChannel = pl?.snippet?.channelTitle || '';
    const plCount = pl?.contentDetails?.itemCount || items.length;
    const plDate = pl?.snippet?.publishedAt ? new Date(pl.snippet.publishedAt).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}) : '';

    $('playlist-header-info').innerHTML = `
      <img class="playlist-thumb" src="${plThumb}" alt="">
      <div class="playlist-meta-text">
        <h2>${escHtml(plTitle)}</h2>
        <p>${escHtml(plChannel)} · ${plCount} videos · Created ${plDate}</p>
      </div>`;

    const body = $('playlist-body');
    body.innerHTML = '';
    items.forEach((item, i) => {
      const vid = item.contentDetails?.videoId || item.snippet?.resourceId?.videoId;
      const t = item.snippet?.title || 'Untitled';
      const ch = item.snippet?.channelTitle || '';
      const th = item.snippet?.thumbnails?.medium?.url || '';
      const row = document.createElement('div');
      row.className = 'playlist-item'; row.tabIndex = 0;
      row.innerHTML = `
        <span class="playlist-num">${i+1}</span>
        <img class="playlist-item-thumb" src="${th}" alt="" loading="lazy" onerror="this.style.display='none'">
        <div>
          <div class="playlist-item-title">${escHtml(t)}</div>
          <div class="playlist-item-ch">${escHtml(ch)}</div>
        </div>`;
      if (vid) {
        row.addEventListener('click', () => { backTarget='playlist'; playVideo(vid, t); });
        row.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' ') { e.preventDefault(); backTarget='playlist'; playVideo(vid,t); } });
      }
      body.appendChild(row);
    });

    showScreen('playlist');
  } catch(e) {
    hideLoading();
    toast('Failed to load playlist');
    console.error(e);
  }
}

$('back-from-playlist-btn').addEventListener('click', () => showScreen('results'));
$('play-all-btn').addEventListener('click', () => {
  if (!playerReady) { toast('Player not ready'); return; }
  backTarget='playlist';
  $('player-title').textContent = 'Playlist';
  showScreen('player');
  ytPlayer.loadPlaylist({list: currentPlaylistId, listType:'playlist'});
  showOverlay();
});

// ── SEARCH UI EVENTS ──
$('search-btn').addEventListener('click', () => {
  const q = $('search-input').value.trim();
  if (q) doSearch(q, searchType);
});
$('search-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') { const q = e.target.value.trim(); if(q) doSearch(q, searchType); }
});

document.querySelectorAll('#search-type-tabs .type-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('#search-type-tabs .type-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    searchType = tab.dataset.type;
  });
  tab.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' ') tab.click(); });
});

$('results-search-btn').addEventListener('click', () => {
  const q = $('results-search-input').value.trim();
  if (q) doSearch(q, resultsType);
});
$('results-search-input').addEventListener('keydown', e => {
  if (e.key==='Enter') { const q=e.target.value.trim(); if(q) doSearch(q,resultsType); }
});

document.querySelectorAll('#results-type-tabs .results-type-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    resultsType = tab.dataset.type;
    doSearch(currentQuery, resultsType);
  });
  tab.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' ') tab.click(); });
});

$('results-logo').addEventListener('click', () => showScreen('search'));
$('results-logo').addEventListener('keydown', e => { if(e.key==='Enter') showScreen('search'); });

// ── KEYBOARD NAVIGATION (TV remote friendly) ──
document.addEventListener('keydown', e => {
  const screen = currentScreen;

  // Player screen keyboard shortcuts
  if (screen === 'player') {
    if (e.key === ' ' || e.key === 'k') {
      e.preventDefault(); $('play-pause-btn').click();
    } else if (e.key === 'ArrowLeft' || e.key === 'j') {
      e.preventDefault(); $('seek-back-btn').click();
    } else if (e.key === 'ArrowRight' || e.key === 'l') {
      e.preventDefault(); $('seek-fwd-btn').click();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault(); $('vol-up-btn').click();
    } else if (e.key === 'ArrowDown') {
      e.preventDefault(); $('vol-down-btn').click();
    } else if (e.key === 'm') {
      $('mute-btn').click();
    } else if (e.key === 'f') {
      $('fullscreen-btn').click();
    } else if (e.key === 'Escape' || e.key === 'Backspace') {
      e.preventDefault(); $('back-from-player-btn').click();
    } else {
      showOverlay();
    }
    return;
  }

  // Grid navigation on results screen
  if (screen === 'results' && ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) {
    e.preventDefault();
    navigateGrid($('results-grid'), e.key);
    return;
  }

  // Escape: go back
  if (e.key === 'Escape' || e.key === 'Backspace') {
    if (screen === 'channel') { $('back-from-channel-btn').click(); }
    else if (screen === 'playlist') { $('back-from-playlist-btn').click(); }
    else if (screen === 'results') { showScreen('search'); $('search-input').focus(); }
  }
});

function navigateGrid(grid, key) {
  const cards = [...grid.querySelectorAll('.card,[tabindex="0"]')];
  if (!cards.length) return;
  const focused = document.activeElement;
  const idx = cards.indexOf(focused);

  // Compute columns
  const cols = Math.round(grid.clientWidth / (cards[0]?.clientWidth || 260)) || 1;

  let next = idx;
  if (key === 'ArrowRight') next = idx + 1;
  else if (key === 'ArrowLeft') next = idx - 1;
  else if (key === 'ArrowDown') next = idx + cols;
  else if (key === 'ArrowUp') next = idx - cols;

  if (next >= 0 && next < cards.length) {
    cards[next].focus();
    cards[next].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

// ── HELPERS ──
function escHtml(str) {
  return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
