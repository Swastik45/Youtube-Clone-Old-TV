<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch — YouTV</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { overflow: hidden; }

  #player-wrap {
    position: fixed;
    inset: 0;
    bottom: 72px;
    background: #000;
  }

  #player-iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  #controls-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 72px;
    background: var(--bg2);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 10px;
  }

  #video-title {
    flex: 1;
    font-size: 14px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 500;
  }
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><p>Loading…</p></div>
<div id="toast"></div>

<div id="player-wrap">
  <iframe id="player-iframe"
    allowfullscreen
    allow="autoplay; fullscreen"
    webkitallowfullscreen
    mozallowfullscreen
    src="about:blank">
  </iframe>
</div>

<div id="controls-bar">
  <span id="video-title"></span>
  <button class="btn btn-ghost" onclick="goBack()">← BACK</button>
  <button class="btn btn-ghost" onclick="reloadVideo()">⟳ RELOAD</button>
  <button class="btn btn-red"   onclick="tryFullscreen()">⛶ FULLSCREEN</button>
</div>

<script src="shared.js"></script>
<script>
  var videoId    = loadState('videoId', '');
  var videoTitle = loadState('videoTitle', '');
  var backTo     = loadState('playerBackTo', 'search');

  gid('video-title').textContent = videoTitle || '';

  // ── BLANK SRC: data: URI is more reliable than about:blank on old TV WebKit.
  //    Some Samsung/LG firmwares keep the audio decoder alive with about:blank
  //    but fully release it with a data: URI that has no media content.
  var BLANK_SRC = 'data:text/html;charset=utf-8,%3Chtml%3E%3C%2Fhtml%3E';

  function killIframe() {
    // Step 1: mute — stops audible bleed immediately on all platforms
    var iframe = gid('player-iframe');
    try {
      // postMessage mute (YouTube iFrame API listens even without enablejsapi on some builds)
      iframe.contentWindow.postMessage('{"event":"command","func":"mute","args":[]}', '*');
      iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":[]}', '*');
    } catch (ignore) {}

    // Step 2: swap src to blank data URI — releases media pipeline
    iframe.src = BLANK_SRC;

    // Step 3: on old WebViews the iframe element itself must be removed from DOM
    //         and re-inserted to fully destroy the media decoder handle
    var wrap = gid('player-wrap');
    if (wrap && iframe.parentNode === wrap) {
      wrap.removeChild(iframe);
      // Re-append so the element exists if user hits reload before navigation completes
      setTimeout(function() { wrap.appendChild(iframe); }, 50);
    }
  }

  function navigateTo(dest) {
    // Use replaceState so the TV hardware BACK button skips video.html entirely
    // and goes straight back to the results/playlist/channel page.
    try {
      window.history.replaceState(null, '', dest);
      window.location.replace(dest);   // replace() does NOT push to history stack
    } catch (e) {
      window.location.href = dest;     // fallback for very old WebViews
    }
  }

  function loadVideo(vid) {
    if (!vid) return;
    var src = 'https://www.youtube-nocookie.com/embed/' + vid +
      '?autoplay=1&rel=0&modestbranding=1&iv_load_policy=3&playsinline=1&controls=1';
    var iframe = gid('player-iframe');
    // Kill any previous session first, then wait one event-loop tick
    iframe.src = BLANK_SRC;
    setTimeout(function() { iframe.src = src; }, 250);
  }

  var playlistSrc = loadState('playlistSrc', '');

  if (playlistSrc && !videoId) {
    gid('video-title').textContent = loadState('videoTitle', 'Playlist');
    var iframe = gid('player-iframe');
    iframe.src = BLANK_SRC;
    setTimeout(function() { iframe.src = playlistSrc; saveState('playlistSrc', ''); }, 250);
  } else if (videoId) {
    loadVideo(videoId);
  } else {
    gid('player-wrap').innerHTML = '<div class="msg" style="padding-top:30vh;color:#555;">No video selected.</div>';
  }

  function goBack() {
    var dest = backTo === 'playlist' ? 'playlists.html'
             : backTo === 'channel'  ? 'channel.html'
             : 'search.html';

    // Kill media first, then navigate after a tick so the iframe
    // teardown completes before the page unloads
    killIframe();
    setTimeout(function() { navigateTo(dest); }, 150);
  }

  function reloadVideo() {
    if (!videoId) return;
    loadVideo(videoId);
    showToast('Reloading…');
  }

  function tryFullscreen() {
    var el = gid('player-iframe');
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullScreen) el.webkitRequestFullScreen();
    else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
    else showToast('Fullscreen not supported on this device');
  }

  // Hardware BACK key (keyCode 8 = Backspace, 27 = Escape, 10009 = Samsung Tizen BACK)
  document.addEventListener('keydown', function(e) {
    if (e.keyCode === 8 || e.keyCode === 27 || e.keyCode === 10009) {
      e.preventDefault();
      goBack();
    }
  });

  // Handle browser/TV native back navigation (popstate fires on hardware back on some TVs)
  window.addEventListener('popstate', function() {
    goBack();
  });
</script>
</body>
</html>
