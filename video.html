<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>YouTV</title>

<style>

body{
margin:0;
background:#000;
overflow:hidden;
font-family:sans-serif;
}

#player-wrap{
position:fixed;
inset:0;
bottom:72px;
background:#000;
}

#player{
width:100%;
height:100%;
}

#controls{
position:fixed;
bottom:0;
left:0;
right:0;
height:72px;
display:flex;
gap:10px;
align-items:center;
padding:0 15px;
background:#111;
border-top:1px solid #222;
}

button{
padding:10px;
border:none;
background:#222;
color:white;
cursor:pointer;
border-radius:8px;
}

button:hover{
background:#333;
}

#title{
flex:1;
overflow:hidden;
white-space:nowrap;
text-overflow:ellipsis;
color:#aaa;
}

</style>
</head>

<body>

<div id="player-wrap">
<div id="player"></div>
</div>

<div id="controls">

<span id="title"></span>

<button onclick="togglePlay()">⏯</button>

<button onclick="seek(-10)">
-10s
</button>

<button onclick="seek(10)">
+10s
</button>

<button onclick="reloadVideo()">
⟳
</button>

<button onclick="toggleMute()">
🔇
</button>

<button onclick="toggleLoop()">
🔁
</button>

<button onclick="fullscreen()">
⛶
</button>

<button onclick="goBack()">
←
</button>

</div>


<script>

let videoId =
localStorage.getItem("videoId") || "";

let videoTitle =
localStorage.getItem("videoTitle") || "";

let backTo =
localStorage.getItem(
"playerBackTo"
) || "search";

document.getElementById(
"title"
).textContent =
videoTitle;

let player;
let loop=false;

let tag =
document.createElement("script");

tag.src =
"https://www.youtube.com/iframe_api";

document.head.appendChild(tag);



function onYouTubeIframeAPIReady(){

if(!videoId){

document.body.innerHTML=
"<h2 style='color:white;text-align:center;padding-top:40vh'>No video</h2>";

return;

}


player =
new YT.Player(
"player",{

videoId,

playerVars:{

autoplay:1,
mute:0,
controls:1,
playsinline:1,
rel:0,
modestbranding:1,
iv_load_policy:3,
fs:1,
enablejsapi:1,
origin:location.origin,
disablekb:0,
cc_load_policy:0

},

events:{

onReady:onReady,

onStateChange:onStateChange

}

});

}



function onReady(e){

let saved=
localStorage.getItem(
"watch_"+videoId
);

if(saved){

e.target.seekTo(
parseFloat(saved),
true
);

}


attemptAutoplay();

}



function attemptAutoplay(){

player.playVideo();

setTimeout(()=>{

let state=
player.getPlayerState();

if(
state!==1
){

player.mute();

player.playVideo();

}

},500);

}



function onStateChange(e){

if(
e.data===YT.PlayerState.ENDED &&
loop
){

player.playVideo();

}

}



setInterval(()=>{

if(
player &&
player.getCurrentTime
){

localStorage.setItem(

"watch_"+videoId,

player.getCurrentTime()

);

}

},5000);



function togglePlay(){

let s=
player.getPlayerState();

if(
s===1
)
player.pauseVideo();

else
player.playVideo();

}



function reloadVideo(){

player.loadVideoById(
videoId
);

}



function seek(sec){

let t=
player.getCurrentTime();

player.seekTo(
t+sec,
true
);

}



function toggleMute(){

if(
player.isMuted()
)

player.unMute();

else

player.mute();

}



function toggleLoop(){

loop=!loop;

alert(
"Loop "+
(loop?"ON":"OFF")
);

}



function fullscreen(){

let iframe=
document.querySelector(
"#player iframe"
);

if(
iframe.requestFullscreen
)

iframe.requestFullscreen();

}



function goBack(){

if(player)
player.destroy();

location.href=
backTo==="playlist"
? "playlists.html"
: backTo==="channel"
? "channel.html"
: "search.html";

}



document.addEventListener(
"keydown",
e=>{

switch(e.key){

case " ":
e.preventDefault();
togglePlay();
break;

case "ArrowRight":
seek(10);
break;

case "ArrowLeft":
seek(-10);
break;

case "f":
fullscreen();
break;

case "m":
toggleMute();
break;

case "Escape":
goBack();
break;

}

});



document.addEventListener(
"visibilitychange",

()=>{

if(
!document.hidden &&
player
){

attemptAutoplay();

}

});

</script>

</body>
</html>
