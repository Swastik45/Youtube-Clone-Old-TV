<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch — YouTV</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#000;
}

#player-wrap{
    position:fixed;
    inset:0;
    bottom:72px;
    background:#000;
}

#player{
    width:100%;
    height:100%;
}

#controls-bar{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:72px;
    background:#111;
    border-top:1px solid #222;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 16px;
}

#video-title{
    flex:1;
    color:#aaa;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

button{
    padding:10px 14px;
    border:none;
    cursor:pointer;
    background:#222;
    color:white;
    border-radius:8px;
}

button:hover{
    background:#333;
}
</style>
</head>

<body>

<div id="player-wrap">
    <!-- Container only -->
    <div id="player"></div>
</div>

<div id="controls-bar">
    <span id="video-title"></span>

    <button onclick="goBack()">← BACK</button>
    <button onclick="reloadVideo()">⟳ RELOAD</button>
    <button onclick="tryFullscreen()">⛶ FULLSCREEN</button>
</div>

<script>
let videoId =
localStorage.getItem("videoId") || "";

let videoTitle =
localStorage.getItem("videoTitle") || "";

let backTo =
localStorage.getItem("playerBackTo") || "search";

document.getElementById(
"video-title"
).textContent = videoTitle;

let player;

// Load YouTube API
let tag =
document.createElement("script");

tag.src =
"https://www.youtube.com/iframe_api";

document.head.appendChild(tag);


function onYouTubeIframeAPIReady(){

    if(!videoId){
        document.getElementById(
        "player-wrap"
        ).innerHTML =
        "<h2 style='color:white;text-align:center;padding-top:40vh'>No video selected</h2>";

        return;
    }

    player =
    new YT.Player("player",{

        videoId:videoId,

        playerVars:{
            autoplay:1,
            controls:1,      // show controls
            modestbranding:1,
            rel:0,
            playsinline:1,
            fs:1             // allow fullscreen
        },

        events:{
            onReady:e=>{
                e.target.playVideo();
            }
        }
    });
}


function reloadVideo(){

    if(player)
        player.loadVideoById(videoId);

}


function goBack(){

    if(player)
        player.destroy();

    location.href =
    backTo==="playlist"
    ? "playlists.html"
    : backTo==="channel"
    ? "channel.html"
    : "search.html";

}


function tryFullscreen(){

    let iframe =
    document.querySelector(
    "#player iframe"
    );

    if(
        iframe &&
        iframe.requestFullscreen
    ){

        iframe.requestFullscreen();

    }

}


document.addEventListener(
"keydown",
e=>{

    if(
        e.key==="Escape" ||
        e.key==="Backspace"
    ){

        e.preventDefault();
        goBack();

    }

});
</script>

</body>
</html>
