<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch — YouTV</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { overflow: hidden; }

  #player-wrap {
    position: fixed;
    inset: 0;
    bottom: 72px;
    background: #000;
  }

  #player-iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  #controls-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 72px;
    background: var(--bg2);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 10px;
  }

  #video-title {
    flex: 1;
    font-size: 14px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 500;
  }
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><p>Loading…</p></div>
<div id="toast"></div>

<div id="player-wrap">
  <iframe id="player-iframe"
    allowfullscreen
    allow="autoplay; fullscreen"
    webkitallowfullscreen
    mozallowfullscreen
    src="about:blank">
  </iframe>
</div>

<div id="controls-bar">
  <span id="video-title"></span>
  <button class="btn btn-ghost" onclick="goBack()">← BACK</button>
  <button class="btn btn-ghost" onclick="reloadVideo()">⟳ RELOAD</button>
  <button class="btn btn-red"   onclick="tryFullscreen()">⛶ FULLSCREEN</button>
</div>

<script src="shared.js"></script>
<script>
  var videoId    = loadState('videoId', '');
  var videoTitle = loadState('videoTitle', '');
  var backTo     = loadState('playerBackTo', 'search');

  gid('video-title').textContent = videoTitle || '';

  function loadVideo(vid) {
    if (!vid) return;
    var src = 'https://www.youtube-nocookie.com/embed/' + vid +
      '?autoplay=1&rel=0&modestbranding=1&iv_load_policy=3&playsinline=1&controls=1';
    var iframe = gid('player-iframe');
    iframe.src = 'about:blank';
    setTimeout(function() { iframe.src = src; }, 200);
  }

  var playlistSrc = loadState('playlistSrc', '');

  if (playlistSrc && !videoId) {
    // Play-all mode from playlists page
    gid('video-title').textContent = loadState('videoTitle', 'Playlist');
    var iframe = gid('player-iframe');
    iframe.src = 'about:blank';
    setTimeout(function() { iframe.src = playlistSrc; saveState('playlistSrc', ''); }, 200);
  } else if (videoId) {
    loadVideo(videoId);
  } else {
    gid('player-wrap').innerHTML = '<div class="msg" style="padding-top:30vh;color:#555;">No video selected.</div>';
  }

  function goBack() {
    gid('player-iframe').src = 'about:blank';
    var dest = backTo === 'playlist' ? 'playlists.html'
             : backTo === 'channel'  ? 'channel.html'
             : 'search.html';
    window.location.href = dest;
  }

  function reloadVideo() {
    if (!videoId) return;
    loadVideo(videoId);
    showToast('Reloading…');
  }

  function tryFullscreen() {
    var el = gid('player-iframe');
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullScreen) el.webkitRequestFullScreen();
    else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
    else showToast('Fullscreen not supported on this device');
  }

  document.addEventListener('keydown', function(e) {
    if (e.keyCode === 8 || e.keyCode === 27) { e.preventDefault(); goBack(); }
  });
</script>
</body>
</html>
