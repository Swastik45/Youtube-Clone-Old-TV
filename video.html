<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch — YouTV</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { overflow: hidden; }

  #player-wrap {
    position: fixed;
    inset: 0;
    bottom: 72px;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Target the native video tag to scale perfectly across the screen */
  #player-video {
    width: 100%;
    height: 100%;
    display: block;
    outline: none;
  }

  #controls-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 72px;
    background: var(--bg2);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 10px;
  }

  #video-title {
    flex: 1;
    font-size: 14px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 500;
  }
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><p>Loading…</p></div>
<div id="toast"></div>

<div id="player-wrap">
  <!-- Dropped the iframe. Using a raw HTML5 video player with clean native controls -->
  <video id="player-video" 
         controls 
         autoplay 
         playsinline>
         Your browser does not support raw playback.
  </video>
</div>

<div id="controls-bar">
  <span id="video-title"></span>
  <button class="btn btn-ghost" onclick="goBack()">← BACK</button>
  <button class="btn btn-ghost" onclick="reloadVideo()">⟳ RELOAD</button>
  <button class="btn btn-red"   onclick="tryFullscreen()">⛶ FULLSCREEN</button>
</div>

<script src="shared.js"></script>
<script>
  var videoId    = loadState('videoId', '');
  var videoTitle = loadState('videoTitle', '');
  var backTo     = loadState('playerBackTo', 'search');

  gid('video-title').textContent = videoTitle || '';

  function loadVideo(vid) {
    if (!vid) return;
    
    var videoElement = gid('player-video');
    
    /* 
      CRITICAL: You cannot inject a regular youtube.com/watch link into a video tag source.
      You must pass the videoId to an extraction utility or proxy pipeline.
      
      Option A: Use a public Invidious API routing endpoint:
      `https://invidious.snopyta.org/latest/videos/${vid}/stream`
      
      Option B: Route it via your own self-hosted backend scraper (yt-dlp wrapper API):
      `https://your-backend-api.local/stream?id=${vid}`
    */
    var rawStreamUrl = 'https://invidious.snopyta.org/latest/videos/' + vid + '/stream';

    videoElement.src = rawStreamUrl;
    videoElement.load();
  }

  // Playlist management logic adapted for direct source streaming streams
  var playlistSrc = loadState('playlistSrc', '');

  if (playlistSrc && !videoId) {
    gid('video-title').textContent = loadState('videoTitle', 'Playlist');
    var videoElement = gid('player-video');
    videoElement.src = playlistSrc; // Expects raw stream media playlist URL (.m3u8)
    videoElement.load();
    saveState('playlistSrc', '');
  } else if (videoId) {
    loadVideo(videoId);
  } else {
    gid('player-wrap').innerHTML = '<div class="msg" style="padding-top:30vh;color:#555;">No video selected.</div>';
  }

  function goBack() {
    var videoElement = gid('player-video');
    if (videoElement) {
      videoElement.pause();
      videoElement.src = ""; // Unbind resources cleanly
    }
    var dest = backTo === 'playlist' ? 'playlists.html'
             : backTo === 'channel'  ? 'channel.html'
             : 'search.html';
    window.location.href = dest;
  }

  function reloadVideo() {
    if (!videoId) return;
    loadVideo(videoId);
    showToast('Reloading…');
  }

  function tryFullscreen() {
    var el = gid('player-video'); // Target the video element directly instead of iframe wrapper
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullScreen) el.webkitRequestFullScreen();
    else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
    else showToast('Fullscreen not supported on this device');
  }

  document.addEventListener('keydown', function(e) {
    if (e.keyCode === 8 || e.keyCode === 27) { e.preventDefault(); goBack(); }
  });
</script>
</body>
</html>
