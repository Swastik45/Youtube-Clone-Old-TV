<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch — YouTV</title>

<link rel="stylesheet" href="styles.css">
<style>
  body { overflow: hidden; }

  #player-wrap {
    position: fixed;
    inset: 0;
    bottom: 72px;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Target the native video tag to scale perfectly across the screen */
  #player-video {
    width: 100%;
    height: 100%;
    display: block;
    outline: none;
  }

  #controls-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 72px;
    background: var(--bg2);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 10px;
  }

  #video-title {
    flex: 1;
    font-size: 14px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 500;
  }
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><p>Loading…</p></div>
<div id="toast"></div>

<div id="player-wrap">
  <!-- Dropped the iframe. Using a raw HTML5 video player with clean native controls -->
  <video id="player-video" 
         controls 
         autoplay 
         playsinline>
         Your browser does not support raw playback.
  </video>
</div>

<div id="controls-bar">
  <span id="video-title"></span>
  <button class="btn btn-ghost" onclick="goBack()">← BACK</button>
  <button class="btn btn-ghost" onclick="reloadVideo()">⟳ RELOAD</button>
  <button class="btn btn-red"   onclick="tryFullscreen()">⛶ FULLSCREEN</button>
</div>

<script src="shared.js"></script>
<script>
  var videoId    = loadState('videoId', '');
  var videoTitle = loadState('videoTitle', '');
  var backTo     = loadState('playerBackTo', 'search');

  gid('video-title').textContent = videoTitle || '';

  function loadVideo(vid) {
    if (!vid) return;
    
    var videoElement = gid('player-video');
    
    /*
      Using a reliable public HLS (HTTP Live Streaming) proxy target.
      This provides an .m3u8 master playlist container instead of a raw video file link,
      fixing the MIME type constraint.
    */
    var streamUrl = 'https://vid.puffyan.us/api/v1/videos/' + vid + '/master.m3u8';

    // Fallback source for debugging or native mp4 parsing if needed
    var fallbackUrl = 'https://vid.puffyan.us/latest/videos/' + vid + '/stream';

    if (Hls.isSupported()) {
      // Setup the JS stream engine decoder
      var hls = new Hls({
        maxMaxBufferLength: 10 // Keeps buffering ultra-lean
      });
      hls.loadSource(streamUrl);
      hls.attachMedia(videoElement);
      hls.on(Hls.Events.MANIFEST_PARSED, function() {
        videoElement.play().catch(function(err) {
            console.log("Autoplay blocked by browser policy, waiting for user click.");
        });
      });
      
      // Error recovery pipeline if HLS stream fails
      hls.on(Hls.Events.ERROR, function (event, data) {
        if (data.fatal) {
          console.warn("HLS streaming error encountered. Trying fallback raw stream...");
          videoElement.src = fallbackUrl;
          videoElement.load();
        }
      });

    } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
      // Native support (Safari / iOS devices accept m3u8 playlists instantly)
      videoElement.src = streamUrl;
      videoElement.addEventListener('loadedmetadata', function() {
        videoElement.play();
      });
    } else {
      // Basic fallback engine configuration
      videoElement.src = fallbackUrl;
      videoElement.load();
    }
  }

  // Bind the updated engine into your app's existing structural state
  if (videoId) {
    loadVideo(videoId);
  } else {
    gid('player-wrap').innerHTML = '<div class="msg" style="padding-top:30vh;color:#555;">No video selected.</div>';
  }

  function goBack() {
    var videoElement = gid('player-video');
    if (videoElement) {
      videoElement.pause();
      videoElement.removeAttribute('src'); // Cleanly free memory overhead
      videoElement.load();
    }
    var dest = backTo === 'playlist' ? 'playlists.html'
             : backTo === 'channel'  ? 'channel.html'
             : 'search.html';
    window.location.href = dest;
  }

  function reloadVideo() {
    if (!videoId) return;
    loadVideo(videoId);
    showToast('Reloading stream pipeline…');
  }

  function tryFullscreen() {
    var el = gid('player-video');
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullScreen) el.webkitRequestFullScreen();
    else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
    else showToast('Fullscreen not supported on this device');
  }

  document.addEventListener('keydown', function(e) {
    if (e.keyCode === 8 || e.keyCode === 27) { e.preventDefault(); goBack(); }
  });
</script>
</body>
</html>
